name: Rust CI

on:
  push:
    branches: [main, "fix/native-winit-window-shell"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Validate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run tests
        run: cargo test --all-targets
      - name: Check all targets
        run: cargo check --all-targets
      - name: Build optimized binary
        run: cargo build --release

      - name: Package Windows test build
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/native-shell-test | Out-Null
          Copy-Item "target/release/droidforge-plus.exe" dist/native-shell-test/
          Copy-Item README.md dist/native-shell-test/
          Compress-Archive -Path dist/native-shell-test/* -DestinationPath dist/droidforge-plus-native-winit-test.zip
      - name: Upload Windows test build
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: droidforge-plus-native-winit-windows-test
          path: dist/droidforge-plus-native-winit-test.zip
          if-no-files-found: error
