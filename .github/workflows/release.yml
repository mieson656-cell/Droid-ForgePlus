name: Сборка выпусков
on:
  push:
    branches: ["v*"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    name: Сборка Portable и установщика (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            binary: droidforge-plus
            portable: droidforge-plus-linux-x64-portable.tar.gz
          - os: windows-latest
            binary: droidforge-plus.exe
            portable: droidforge-plus-windows-x64-portable.zip
          - os: macos-latest
            binary: droidforge-plus
            portable: droidforge-plus-macos-aarch64-portable.tar.gz
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Установка библиотек Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libxkbcommon-dev libwayland-dev libx11-dev libxrandr-dev libxi-dev libgl1-mesa-dev libasound2-dev libxcb-randr0-dev libxcb-shape0-dev libxcb-xfixes0-dev
      - name: Запуск тестов
        run: cargo test --all-targets
      - name: Проверка проекта
        run: cargo check --all-targets
      - name: Сборка приложения
        run: cargo build --release

      - name: Создание Portable и установщика Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force dist/portable, installer | Out-Null
          Copy-Item README.md dist/portable/README.md
          Copy-Item "target/release/${{ matrix.binary }}" dist/portable/
          Compress-Archive -Path dist/portable/README.md,dist/portable/${{ matrix.binary }} -DestinationPath "dist/${{ matrix.portable }}"
          choco install innosetup --no-progress -y
          @'
          [Setup]
          AppId={{BDB0EFC4-60AF-4D0A-9A6A-3C77F19B7A31}
          AppName=DroidForge Plus
          AppVersion=0.3.1
          AppPublisher=DroidForge Plus
          DefaultDirName={autopf}\DroidForge Plus
          DefaultGroupName=DroidForge Plus
          OutputDir=dist
          OutputBaseFilename=droidforge-plus-windows-x64-setup
          Compression=lzma2
          SolidCompression=yes
          ArchitecturesInstallIn64BitMode=x64
          UninstallDisplayIcon={app}\droidforge-plus.exe
          [Languages]
          Name: "russian"; MessagesFile: "compiler:Languages\Russian.isl"
          [Files]
          Source: "target\release\droidforge-plus.exe"; DestDir: "{app}"; Flags: ignoreversion
          Source: "README.md"; DestDir: "{app}"; Flags: ignoreversion
          [Icons]
          Name: "{group}\DroidForge Plus"; Filename: "{app}\droidforge-plus.exe"
          Name: "{autodesktop}\DroidForge Plus"; Filename: "{app}\droidforge-plus.exe"; Tasks: desktopicon
          [Tasks]
          Name: "desktopicon"; Description: "Создать ярлык на рабочем столе"; GroupDescription: "Дополнительные ярлыки:"
          [Run]
          Filename: "{app}\droidforge-plus.exe"; Description: "Запустить DroidForge Plus"; Flags: postinstall nowait skipifsilent
          '@ | Set-Content -Encoding UTF8 installer\droidforge-plus.iss
          $candidates = @("$env:ProgramFiles\Inno Setup 6\ISCC.exe", "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")
          $compiler = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $compiler) { $compiler = (Get-Command ISCC.exe -ErrorAction SilentlyContinue).Source }
          if (-not $compiler) { throw "Компилятор Inno Setup не найден." }
          & $compiler installer\droidforge-plus.iss
          if ($LASTEXITCODE -ne 0) { throw "Сборка установщика завершилась с кодом $LASTEXITCODE" }

      - name: Создание Portable и установщика Linux
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/portable deb/DEBIAN deb/opt/droidforge-plus deb/usr/bin deb/usr/share/applications
          cp README.md dist/portable/README.md
          cp target/release/${{ matrix.binary }} dist/portable/
          tar -czf "dist/${{ matrix.portable }}" -C dist/portable README.md ${{ matrix.binary }}
          install -m 0755 target/release/${{ matrix.binary }} deb/opt/droidforge-plus/droidforge-plus
          ln -s /opt/droidforge-plus/droidforge-plus deb/usr/bin/droidforge-plus
          install -m 0644 README.md deb/opt/droidforge-plus/README.md
          cat > deb/DEBIAN/control <<'EOF'
          Package: droidforge-plus
          Version: 0.3.1
          Section: utils
          Priority: optional
          Architecture: amd64
          Maintainer: DroidForge Plus
          Description: Графическая программа для управления Android через ADB и Fastboot
          EOF
          cat > deb/usr/share/applications/droidforge-plus.desktop <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=DroidForge Plus
          Comment=Управление Android через ADB и Fastboot
          Exec=droidforge-plus
          Icon=application-x-executable
          Terminal=false
          Categories=Utility;Development;
          EOF
          dpkg-deb --root-owner-group --build deb "dist/droidforge-plus-linux-x64.deb"

      - name: Создание Portable и установщика macOS
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/portable "DroidForge Plus.app/Contents/MacOS" pkgroot/Applications
          cp README.md dist/portable/README.md
          cp target/release/${{ matrix.binary }} dist/portable/
          tar -czf "dist/${{ matrix.portable }}" -C dist/portable README.md ${{ matrix.binary }}
          install -m 0755 target/release/${{ matrix.binary }} "DroidForge Plus.app/Contents/MacOS/droidforge-plus"
          cat > "DroidForge Plus.app/Contents/Info.plist" <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
          <key>CFBundleName</key><string>DroidForge Plus</string>
          <key>CFBundleDisplayName</key><string>DroidForge Plus</string>
          <key>CFBundleIdentifier</key><string>com.droidforge.plus</string>
          <key>CFBundleVersion</key><string>0.3.1</string>
          <key>CFBundleShortVersionString</key><string>0.3.1</string>
          <key>CFBundlePackageType</key><string>APPL</string>
          <key>CFBundleExecutable</key><string>droidforge-plus</string>
          </dict></plist>
          EOF
          cp -R "DroidForge Plus.app" pkgroot/Applications/
          pkgbuild --root pkgroot --identifier com.droidforge.plus.pkg --version 0.3.1 --install-location / "dist/droidforge-plus-macos-aarch64.pkg"

      - name: Загрузка собранных файлов
        uses: actions/upload-artifact@v4
        with:
          name: droidforge-plus-${{ matrix.os }}
          path: |
            dist/*.zip
            dist/*.tar.gz
            dist/*.deb
            dist/*.pkg
            dist/*-setup.exe
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/heads/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Проверка актуальности исходного кода
        id: revision
        shell: bash
        run: |
          remote_sha="$(git ls-remote origin "refs/heads/${GITHUB_REF_NAME}" | cut -f1)"
          if [[ "$remote_sha" == "$GITHUB_SHA" ]]; then
            echo "is_latest=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_latest=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Обновление тега до проверенного коммита
        if: steps.revision.outputs.is_latest == 'true'
        run: |
          git tag -f "${GITHUB_REF_NAME}" "${GITHUB_SHA}"
          git push --force origin "refs/tags/${GITHUB_REF_NAME}"
      - name: Публикация выпуска
        if: steps.revision.outputs.is_latest == 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          tag_name: ${{ github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: DroidForge Plus v0.3.1 — русская версия и установщики
          body_path: .github/RELEASE_NOTES_RU.md
          generate_release_notes: false
          fail_on_unmatched_files: true
