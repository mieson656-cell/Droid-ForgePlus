[package]
name = "droidforge-plus"
version = "0.4.3"
edition = "2021"
description = "Настольная программа для управления Android через ADB и Fastboot"

[dependencies]
egui = "0.29"
egui-winit = "0.29"
egui-wgpu = "0.29"
winit = "0.30"
pollster = "0.3"
rfd = "0.15"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
