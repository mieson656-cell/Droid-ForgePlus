[package]
name = "droidforge-plus"
version = "0.3.1"
edition = "2021"
description = "Настольная программа для управления Android через ADB и Fastboot"

[dependencies]
eframe = { version = "0.29", features = ["wgpu"] }
egui = "0.29"
rfd = "0.15"

[target.'cfg(windows)'.dependencies]
wgpu = { version = "22.1", default-features = false, features = ["dx12", "vulkan", "gles"] }

[target.'cfg(target_os = "linux")'.dependencies]
wgpu = { version = "22.1", default-features = false, features = ["vulkan", "gles"] }

[target.'cfg(target_os = "macos")'.dependencies]
wgpu = { version = "22.1", default-features = false, features = ["metal", "gles"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
